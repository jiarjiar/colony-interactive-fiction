<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>《殖民地》概念图总览</title><style>
:root{--ink:#18201e;--paper:#e4e6e2;--muted:#9aa19c;--leaf:#7daa5a;--warn:#d78458}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}header{max-width:1400px;margin:auto;padding:64px 28px 32px;display:flex;justify-content:space-between;gap:30px;align-items:end}h1{font-size:clamp(38px,6vw,82px);margin:0;letter-spacing:.08em}header p{max-width:560px;color:var(--muted);line-height:1.8;margin:0}main{max-width:1400px;margin:auto;padding:20px 28px 90px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}figure{margin:0;background:#25302d;border:1px solid #525a58;border-radius:18px;overflow:hidden}img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;transition:.2s}a:hover img{filter:brightness(1.06)}figcaption{padding:18px 20px 22px;display:flex;justify-content:space-between;gap:18px;align-items:baseline}figcaption b{font-size:20px}figcaption span{color:var(--muted);font-size:14px;text-align:right}footer{max-width:1400px;margin:auto;padding:0 28px 60px;color:var(--muted);line-height:1.8}@media(max-width:800px){header{display:block}header p{margin-top:20px}main{grid-template-columns:1fr}figcaption{display:block}figcaption span{display:block;text-align:left;margin-top:8px}}</style></head><body><header><div><small>PHILIP K. DICK · INTERACTIVE ADAPTATION</small><h1>殖民地</h1></div><p>十四张视觉开发图以正常日光、冷静观察和可测量的物理误差为核心。复制物没有怪物外形；它们只比真实物品更整齐、更饱和，也更愿意执行“物品”的用途。</p></header><main><figure><a href="01-蓝星基地.jpg"><img src="01-蓝星基地.jpg" alt="蓝星基地"></a><figcaption><b>01 · 蓝星基地</b><span>安全评估：无已知危险</span></figcaption></figure>
<figure><a href="02-一毫米误差.jpg"><img src="02-一毫米误差.jpg" alt="一毫米误差"></a><figcaption><b>02 · 一毫米误差</b><span>显微镜的高光向下滑动</span></figcaption></figure>
<figure><a href="03-住舱毛巾.jpg"><img src="03-住舱毛巾.jpg" alt="住舱毛巾"></a><figcaption><b>03 · 住舱毛巾</b><span>布料先于手臂收紧</span></figcaption></figure>
<figure><a href="04-地毯救援.jpg"><img src="04-地毯救援.jpg" alt="地毯救援"></a><figcaption><b>04 · 地毯救援</b><span>公开证据第一次留在所有人眼前</span></figcaption></figure>
<figure><a href="05-两双手套.jpg"><img src="05-两双手套.jpg" alt="两双手套"></a><figcaption><b>05 · 两双手套</b><span>磨损、油污和折痕完全一致</span></figcaption></figure>
<figure><a href="06-两辆采集车.jpg"><img src="06-两辆采集车.jpg" alt="两辆采集车"></a><figcaption><b>06 · 两辆采集车</b><span>同一个编号停在坡地两侧</span></figcaption></figure>
<figure><a href="07-湖岸弃装.jpg"><img src="07-湖岸弃装.jpg" alt="湖岸弃装"></a><figcaption><b>07 · 湖岸弃装</b><span>自然物第一次比装备可靠</span></figcaption></figure>
<figure><a href="08-半间实验室.jpg"><img src="08-半间实验室.jpg" alt="半间实验室"></a><figcaption><b>08 · 半间实验室</b><span>砷化氢把复制物从用途还原成形状</span></figcaption></figure>

<figure><a href="11-通讯室.jpg"><img src="11-通讯室.jpg" alt="通讯室"></a><figcaption><b>11 · 通讯室</b><span>标准呼号必须由人回答</span></figcaption></figure>
<figure><a href="12-静默救援舰.jpg"><img src="12-静默救援舰.jpg" alt="静默救援舰"></a><figcaption><b>12 · 静默救援舰</b><span>它提前十分钟出现，草地没有听见</span></figcaption></figure>

<figure><a href="14-湖岸隔离地.jpg"><img src="14-湖岸隔离地.jpg" alt="湖岸隔离地"></a><figcaption><b>14 · 湖岸隔离地</b><span>距离成为最后一种诚实</span></figcaption></figure></main><footer>视觉锚点：正常光线而非黑暗｜乳白半透明显形态｜复制品反光过度均匀｜为剧情 UI 保留负空间｜无血液与器官意象。点击任意画面可打开原尺寸 JPG。</footer></body></html>
